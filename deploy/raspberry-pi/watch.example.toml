# footy-watch configuration. Secrets can also be set as environment variables
# (FOOTY_ODDSAPI_KEY, FOOTY_BETFAIR_APP_KEY, FOOTY_BETFAIR_USERNAME, FOOTY_BETFAIR_PASSWORD,
#  FOOTY_TELEGRAM_TOKEN, FOOTY_TELEGRAM_CHAT_ID, FOOTY_NTFY_TOPIC, FOOTY_WATCH_TOKEN).

[server]
host = "0.0.0.0"          # reachable from your phone on the home network
port = 8080
token = ""                # optional shared secret required by `footy push-picks --token`
db = "footy-watch.db"
picks_file = "picks.json"
timezone = "Europe/Sofia" # times in alerts and on the status page

[alerts]
# "Wrong odds": a target book's price (after commission) beats the reference's
# no-margin price by at least min_edge. Reference books are tried in order.
reference_books = ["pinnacle", "betfair_ex_eu", "betfair"]
# Books you can actually bet at. Pinnacle is available through BetInAsia, so to be
# told when Pinnacle itself is out of line with the exchange, list "pinnacle" here
# and put the exchange first in reference_books.
target_books = ["*"]
pick_books = ["*"]
markets = ["1x2", "ou", "ah"]
min_edge = 0.03
max_edge = 0.25           # bigger "edges" are usually stale prices or feed errors
lookahead_hours = 36
max_quote_age_minutes = 30
min_exchange_size = 20    # ignore exchange prices with less money available
cooldown_minutes = 240    # repeat an alert only after this, or if the edge grows by reprice_step
reprice_step = 0.01
# Arbitrage: the best price for every outcome, spread over books, returns more than the stake
# whatever the result. List only books you can use, or most arbs will be at books you can't reach.
arb_alerts = true
arb_books = ["*"]         # e.g. ["pinnacle", "betfair_ex_eu", "polymarket"]
min_arb = 0.005           # 0.5% locked in, after commission and fees
max_arb = 0.10            # bigger ones are almost always stale prices

[commission]              # on net winnings
betfair_ex_eu = 0.05
betfair = 0.05
matchbook = 0.02

# ---------------------------------------------------------------- feeds
[oddsapi]                 # https://the-odds-api.com : Pinnacle + Betfair Exchange + many books
enabled = false
api_key = ""
regions = "eu"            # "eu" includes pinnacle and betfair_ex_eu
markets = ["h2h", "totals", "spreads"]
bookmakers = []           # e.g. ["pinnacle", "betfair_ex_eu"] to limit the feed (cheaper)
monthly_credits = 500     # your plan; polling is spaced so credits last the month
min_interval_seconds = 600

[betfair]                 # Betfair Exchange API: free delayed key (prices 1-180 s late)
enabled = false
app_key = ""
username = ""
password = ""
interval_seconds = 30
competitions = []         # Betfair competition ids; empty = all football in lookahead

[polymarket]              # Polymarket football markets: public data, no key needed
enabled = false           # check what's listed with: python3 -m footy.watch polymarket
sports = []               # sport codes from that list; empty = every football league
interval_seconds = 60

[fees]                    # prediction-market taker fee: rate * p * (1 - p) per share at price p
polymarket = 0.05         # check the fee shown on the market; resting limit (maker) orders pay none

[file]                    # read odds from a JSON file written by another program
enabled = false
path = "odds.json"

[notify]
console = true
telegram_token = ""       # create a bot with @BotFather; send it a message; chat id from getUpdates
telegram_chat_id = ""
ntfy_topic = ""           # or install the ntfy app and subscribe to a hard-to-guess topic name
ntfy_server = "https://ntfy.sh"

# ---------------------------------------------------------- paper trading
# Every alert becomes an imaginary bet, recorded at three places with separate
# bankrolls: the best price, Pinnacle, and the Betfair Exchange (after commission).
# EV is stored when the bet is placed, the closing line just before kickoff (CLV),
# and results come from the-odds-api scores and football-data.co.uk.
# Page: http://<pi>:8080/paper   Terminal: python3 -m footy.watch paper
[paper]
enabled = true
bankroll = 1000
currency = "€"
staking = "flat"          # "flat" or "kelly"
flat_stake = 10
kelly_fraction = 0.25     # used when staking = "kelly"
max_stake_pct = 0.03
venues = ["best", "pinnacle", "betfair", "polymarket", "arb"]   # feeds you don't use are skipped
arb_stake = 100           # total stake per arbitrage, split across its legs
strategies = ["*"]        # or e.g. ["F1", "F2"] to leave out the "wrong odds" bets
best_books = ["*"]        # limit "best price" to books you can use, e.g. ["pinnacle", "betfair_ex_eu", "sport888"]
closing_snapshot_minutes = 10   # the-odds-api: one extra request per match ~10 min before kickoff (3 credits)
void_after_days = 7       # no result found by then -> stake returned
