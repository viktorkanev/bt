[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "footy"
version = "0.1.0"
description = "Football results tracking, rating, prediction and betting-strategy backtesting engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyarrow>=12",
  "requests>=2.28",
  "pyyaml>=6",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "plotly>=5.15"]
dev = ["pytest>=7"]

[project.scripts]
footy = "footy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
